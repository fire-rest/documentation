name: Changelog newsletter

# Sends the newest changelog entry to the Buttondown list when it lands on main.
# Only a new `## ` heading triggers a send — see .github/scripts/send-changelog-email.mjs.

on:
  push:
    branches: [main]
    paths: ['en/changelog.mdx']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the email instead of sending it'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs against HEAD^ to tell a new entry from an edit.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node .github/scripts/send-changelog-email.mjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
