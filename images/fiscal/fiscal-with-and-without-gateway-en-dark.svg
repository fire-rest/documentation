<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 325" role="img" aria-label="The till talks to Fire and Fire talks to the fiscal provider. With the gateway, the till requests the numbers before injecting. Always, the till injects the order, Fire delivers the sale to the provider, the provider submits it to the tax authority and reports the verdict to Fire." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F4F4F5"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F5B84B"/></marker>
  </defs>
  <line x1="20" y1="14" x2="52" y2="14" stroke="#F5B84B" stroke-width="2.5"/>
  <text x="60" y="18" fill="#F5B84B" font-weight="600">Only with the gateway: before injecting</text>
  <line x1="340" y1="14" x2="372" y2="14" stroke="#F4F4F5" stroke-width="2"/>
  <text x="380" y="18" fill="#F4F4F5" font-weight="600">Always, with or without the gateway</text>
  <g fill="#1F1F23" stroke="#46464D" stroke-width="1.5">
    <rect x="20" y="36" width="120" height="280" rx="8"/>
    <rect x="260" y="36" width="120" height="280" rx="8" stroke="#FF6B7B" stroke-width="2"/>
    <rect x="500" y="36" width="120" height="280" rx="8"/>
    <rect x="720" y="36" width="120" height="280" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#F4F4F5" font-size="15" font-weight="600">
    <text x="80" y="66">Till</text>
    <text x="320" y="66">Fire</text>
    <text x="560" y="66">Fiscal provider</text>
    <text x="780" y="66">Tax authority</text>
  </g>
  <g stroke="#F5B84B" stroke-width="2.5" fill="none">
    <line x1="140" y1="110" x2="259" y2="110" marker-end="url(#g)"/>
    <line x1="380" y1="110" x2="499" y2="110" marker-end="url(#g)"/>
    <line x1="500" y1="142" x2="381" y2="142" marker-end="url(#g)"/>
    <line x1="260" y1="142" x2="141" y2="142" marker-end="url(#g)"/>
  </g>
  <g text-anchor="middle" fill="#F5B84B" font-weight="500">
    <text x="200" y="102">requests numbers</text>
    <text x="440" y="102">requests numbers</text>
    <text x="440" y="160">returns them</text>
    <text x="200" y="160">returns them</text>
    <text x="80" y="147">prints</text>
  </g>
  <g stroke="#F4F4F5" stroke-width="2" fill="none">
    <line x1="140" y1="226" x2="259" y2="226" marker-end="url(#a)"/>
    <line x1="380" y1="226" x2="499" y2="226" marker-end="url(#a)"/>
    <line x1="620" y1="226" x2="719" y2="226" marker-end="url(#a)"/>
    <line x1="720" y1="266" x2="621" y2="266" marker-end="url(#a)"/>
    <line x1="500" y1="266" x2="381" y2="266" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle" fill="#F4F4F5">
    <text x="200" y="218">injects the order</text>
    <text x="440" y="218">delivers the sale</text>
    <text x="670" y="218">submits it</text>
    <text x="670" y="284">replies</text>
    <text x="440" y="284">reports the verdict</text>
  </g>
</svg>
