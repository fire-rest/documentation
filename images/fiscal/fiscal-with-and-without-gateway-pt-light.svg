<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 325" role="img" aria-label="O caixa fala com o Fire e o Fire com o provedor fiscal. Com gateway, o caixa pede os números antes de injetar. Sempre, o caixa injeta o pedido, o Fire entrega a venda ao provedor, o provedor a envia ao órgão fiscal e avisa o veredito ao Fire." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#18181B"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B45309"/></marker>
  </defs>
  <line x1="20" y1="14" x2="52" y2="14" stroke="#B45309" stroke-width="2.5"/>
  <text x="60" y="18" fill="#B45309" font-weight="600">Só com gateway: antes de injetar</text>
  <line x1="340" y1="14" x2="372" y2="14" stroke="#18181B" stroke-width="2"/>
  <text x="380" y="18" fill="#18181B" font-weight="600">Sempre, com ou sem gateway</text>
  <g fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5">
    <rect x="20" y="36" width="120" height="280" rx="8"/>
    <rect x="260" y="36" width="120" height="280" rx="8" stroke="#E6293D" stroke-width="2"/>
    <rect x="500" y="36" width="120" height="280" rx="8"/>
    <rect x="720" y="36" width="120" height="280" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#18181B" font-size="15" font-weight="600">
    <text x="80" y="66">Caixa</text>
    <text x="320" y="66">Fire</text>
    <text x="560" y="66">Provedor fiscal</text>
    <text x="780" y="66">Órgão fiscal</text>
  </g>
  <g stroke="#B45309" stroke-width="2.5" fill="none">
    <line x1="140" y1="110" x2="259" y2="110" marker-end="url(#g)"/>
    <line x1="380" y1="110" x2="499" y2="110" marker-end="url(#g)"/>
    <line x1="500" y1="142" x2="381" y2="142" marker-end="url(#g)"/>
    <line x1="260" y1="142" x2="141" y2="142" marker-end="url(#g)"/>
  </g>
  <g text-anchor="middle" fill="#B45309" font-weight="500">
    <text x="200" y="102">pede os números</text>
    <text x="440" y="102">pede os números</text>
    <text x="440" y="160">os devolve</text>
    <text x="200" y="160">os devolve</text>
    <text x="80" y="147">imprime</text>
  </g>
  <g stroke="#18181B" stroke-width="2" fill="none">
    <line x1="140" y1="226" x2="259" y2="226" marker-end="url(#a)"/>
    <line x1="380" y1="226" x2="499" y2="226" marker-end="url(#a)"/>
    <line x1="620" y1="226" x2="719" y2="226" marker-end="url(#a)"/>
    <line x1="720" y1="266" x2="621" y2="266" marker-end="url(#a)"/>
    <line x1="500" y1="266" x2="381" y2="266" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle" fill="#18181B">
    <text x="200" y="218">injeta o pedido</text>
    <text x="440" y="218">entrega a venda</text>
    <text x="670" y="218">envia</text>
    <text x="670" y="284">responde</text>
    <text x="440" y="284">avisa o veredito</text>
  </g>
</svg>
